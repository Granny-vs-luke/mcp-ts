name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for versioning

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Get current version and bump it
      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          BUMP="${{ github.event.inputs.version_bump }}"
          
          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case $BUMP in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      # Update package.json version
      - name: Update package.json
        run: |
          npm version ${{ steps.new_version.outputs.new_version }} --no-git-tag-version

      # Install and build
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Create commit with version bump
      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.new_version.outputs.new_version }}" || true

      # Create git tag
      - name: Create and push tag
        run: |
          git tag ${{ steps.new_version.outputs.tag }}
          git push origin ${{ steps.new_version.outputs.tag }}

      # Publish to npm
      - name: Publish to npm
        run: npm publish --provenance --access public
        continue-on-error: true

      # Create GitHub release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.new_version.outputs.tag }}
          name: "Release ${{ steps.new_version.outputs.new_version }}"
          body: |
            ## Release Notes
            
            ### Version ${{ steps.new_version.outputs.new_version }}
            
            Released on: ${{ github.event.repository.updated_at }}
            
            ✨ [View commits](https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.current }}...${{ steps.new_version.outputs.tag }})
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}