[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "remote-proxy"
version = "0.1.0"
description = "Remote FastAPI bridge for secure MCP access over outbound WebSocket agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
dependencies = [
  "fastapi>=0.115.12,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic>=2.11.1,<3.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "httpx>=0.28.1,<1.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
remote-proxy = "mcp_remote_server.main:run"
remote-proxy-deploy = "mcp_remote_server.deploy:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_remote_server"]
